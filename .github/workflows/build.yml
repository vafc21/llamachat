name: build

# Cross-platform build for LlamaChat (macOS / Linux / Windows).
# - Every push to master / PR / manual run builds the app and uploads the
#   installers as run artifacts.
# - Pushing a version tag (e.g. v0.1.0) also publishes a GitHub Release with the
#   installers attached, so anyone can download them. Installers are UNSIGNED by
#   default; see docs/SIGNING.md to make them code-signed (warning-free) for free
#   via SignPath Foundation.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            sidecar: bash scripts/build-sidecar.sh
          # Intel Macs (pre-2020). A separate Intel *runner* rather than a
          # cross-compile on Apple Silicon: PyInstaller cannot cross-build the
          # sidecar, so the binary has to be produced on the target arch.
          #
          # Must be `macos-15-intel`, NOT `macos-13`: the macOS 13 image was
          # retired in December 2025 and jobs targeting it are never scheduled
          # -- they queue forever without failing, which silently blocks the
          # release job waiting on them. `macos-15-intel` is the standard-runner
          # x86_64 label and is supported until August 2027.
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            sidecar: bash scripts/build-sidecar.sh
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            sidecar: bash scripts/build-sidecar.sh
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            sidecar: pwsh scripts/build-sidecar.ps1
    runs-on: ${{ matrix.os }}
    # A retired or mistyped runner label is never scheduled: the job sits in
    # `queued` indefinitely instead of failing, and the release job blocks
    # behind it with no error anywhere. Builds take ~12-20 min, so 45 turns
    # that silent hang into a visible failure.
    timeout-minutes: 45
    env:
      FITLLM_SIDECAR_TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux runtime deps + libxdo for enigo input control. `rpm` and
      # `fakeroot` provide rpmbuild/dpkg tooling so the .rpm (and .deb) bundles
      # build; without rpmbuild the `targets: "all"` bundle step fails the whole
      # Linux job and no installers are produced.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev rpm fakeroot

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UI dependencies
        working-directory: ui
        run: npm install

      - name: Build Python sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-sidecar.txt
          ${{ matrix.sidecar }}
        shell: bash

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build app
        run: cargo tauri build
        env:
          # CI has no dev certificate — ad-hoc sign on macOS. Locally the repo
          # config uses a real Apple Development identity (see tauri.conf.json).
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && '-' || '' }}
          # Signs the updater artifacts. Without these the build still produces
          # installers, but every .sig is missing and the in-app updater
          # rejects the release as untrusted.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Both macOS jobs bundle an updater archive named exactly
      # `LlamaChat.app.tar.gz`. They are separate CI artifacts, but they land in
      # one flat GitHub Release, so without this the Intel archive and the Apple
      # Silicon archive collide -- one silently overwrites the other and half of
      # macOS gets updates built for the wrong architecture.
      - name: Disambiguate the macOS updater archive
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          cd target/release/bundle/macos
          for f in *.app.tar.gz *.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            mv "$f" "${f/.app.tar.gz/.app.${{ matrix.triple }}.tar.gz}"
          done
          ls -la

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          # Keyed on the triple, not the OS: two macOS jobs share no runner
          # label suffix, and identical artifact names would collide.
          name: llamachat-${{ matrix.triple }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.sig
          if-no-files-found: ignore

  # Publish a GitHub Release with the installers when a vX.Y.Z tag is pushed:
  #     git tag v0.1.0 && git push origin v0.1.0
  # Installers are UNSIGNED by default — users click "More info -> Run anyway"
  # (Windows) or right-click -> Open (macOS) on first launch. To make them
  # code-signed and warning-free (free for open source), follow docs/SIGNING.md.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      # --- OPTIONAL: code-sign the Windows installers (see docs/SIGNING.md) -----
      # After your SignPath Foundation project is approved, add the repo secret
      # SIGNPATH_API_TOKEN + variable SIGNPATH_ORGANIZATION_ID, then uncomment and
      # adjust the slugs below. It re-signs the Windows artifact in place before
      # the release step attaches it.
      #
      #   - uses: SignPath/github-action-submit-signing-request@v1
      #     with:
      #       api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #       organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #       project-slug: llamachat
      #       signing-policy-slug: release-signing
      #       github-artifact-id: llamachat-x86_64-pc-windows-msvc
      #       wait-for-completion: true
      #       output-artifact-directory: installers/llamachat-x86_64-pc-windows-msvc
      #
      # Exact inputs: https://github.com/SignPath/github-action-submit-signing-request
      # -------------------------------------------------------------------------

      # The manifest the in-app updater polls. Built from the .sig files the
      # matrix just produced, so it can never drift from the actual artifacts.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build latest.json
        run: node scripts/make-latest-json.mjs installers "${{ github.ref_name }}" latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*
            latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false

  # Without this a failed release is invisible: the tag exists, the release
  # never appears, and nothing says why unless someone opens the Actions tab.
  # Fires for a failed *or* cancelled build, and for a release job that never
  # ran because a build job hung.
  notify:
    needs: [build, release]
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.build.result != 'success' || needs.release.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue describing the failure
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Release **${tag}** did not publish.`,
              '',
              `- build: \`${{ needs.build.result }}\``,
              `- release: \`${{ needs.release.result }}\``,
              '',
              `Run: ${url}`,
              '',
              'Installed apps keep polling `latest.json` from the previous release, so',
              'nobody gets a broken update -- they just get no update.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${tag} failed`,
              body,
              labels: ['release-failure'],
            });
